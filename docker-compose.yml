# Defang reads a standard docker-compose file — `defang compose up` will
# build and deploy both services straight from this. Locally, plain
# `docker compose up --build` works the same way.
#
# Secrets (DATABASE_URL, JWT_SECRET, SMTP_*, CLOUDINARY_*, etc.) should
# NOT be hardcoded here. Defang: run `defang config set <NAME>` for each
# one (see README "Deploying with Defang"). Locally: keep them in
# backend/.env / frontend/.env.local, which docker-compose reads via
# env_file below.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - WA_SESSIONS_DIR=/app/wa-sessions
    volumes:
      - wa-sessions:/app/wa-sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point these at wherever `backend` is actually reachable from
        # the BROWSER (not from inside the Docker network) — e.g. your
        # Defang/Render backend URL in production, localhost in dev.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Persists linked WhatsApp sessions (Baileys multi-file auth state)
  # across container restarts/redeploys — without this you'd have to
  # re-scan the QR code every time.
  wa-sessions:
